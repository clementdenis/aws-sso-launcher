<!doctype html>
<meta charset="utf-8">
<title>AWS SSO</title>
<style>
  html, body { height: 100%; margin: 0; font: 13px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  nav { display: flex; gap: 2px; padding: 2px 4px; background: #232f3e; }
  nav button { border: 0; border-radius: 4px; padding: 2px 8px; background: none; color: #fff; cursor: pointer; }
  nav button[aria-pressed="true"] { background: #ff9900; color: #000; }
  nav .spacer { flex: 1; }
  iframe { flex: 1; border: 0; width: 100%; }
  form { padding: 12px; display: grid; gap: 8px; }
  label { display: grid; gap: 2px; }
  [hidden] { display: none !important; }
</style>
<nav>
  <span class="spacer"></span>
  <button id="reload" title="Reload" aria-label="Reload">↻</button>
  <button id="popout" title="Open in a tab" aria-label="Open in a tab">↗</button>
  <button id="toggle-settings" aria-pressed="false" title="Settings" aria-label="Settings">⚙</button>
</nav>
<iframe id="portal" allow="publickey-credentials-get *; clipboard-write"></iframe>
<form id="settings" hidden>
  <p id="welcome" hidden>Welcome! Enter your AWS access portal prefix to get started.</p>
  <label>Access portal prefix
    <input name="prefix" required pattern="[A-Za-z0-9-]+" placeholder="mycompany">
  </label>
  <small>From your portal URL: https://<b>prefix</b>.awsapps.com/start</small>
  <label>Console sign-in region (used for the session list)
    <input name="region" required pattern="[a-z]{2}(-[a-z]+)+-[0-9]" placeholder="us-east-1">
  </label>
  <button>Save</button>
</form>
<script type="module" src="sidepanel.js"></script>

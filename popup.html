<!doctype html>
<meta charset="utf-8">
<title>AWS console sessions</title>
<style>
  body { width: 400px; margin: 0; font: 13px system-ui, sans-serif; }
  header { padding: 8px 12px; background: #232f3e; color: #fff; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #eee; }
  li div { flex: 1; min-width: 0; }
  li b, li small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li small { color: #555; }
  #status { padding: 12px; color: #555; }
  footer { display: flex; gap: 8px; padding: 8px 12px; }
  button { cursor: pointer; }
  footer button { flex: 1; }
  [hidden] { display: none !important; }
</style>
<header id="heading">AWS console sessions</header>
<p id="status">Loading…</p>
<ul id="list"></ul>
<footer>
  <button id="manage" title="AWS session limit page">AWS sessions page</button>
  <button id="portal">Access portal</button>
</footer>
<script type="module" src="popup.js"></script>
